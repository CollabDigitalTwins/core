name: CLA Assistant

# Blocks merging a pull request until every contributor has signed the
# Contributor License Agreement (CLA.md). Contributors sign by posting a comment
# on their PR; signatures are recorded in signatures/version1/cla.json on a
# dedicated `cla-signatures` branch.
#
# ONE-TIME SETUP
#   1. Signatures are committed using the built-in GITHUB_TOKEN by default.
#      (Recommended) Create a fine-grained Personal Access Token with
#      contents:write, add it as the repo secret PERSONAL_ACCESS_TOKEN, and
#      uncomment the line below — a PAT avoids edge cases where GITHUB_TOKEN
#      commits don't re-trigger required status checks.
#   2. In branch protection for `dev` (and `main`), require the
#      "CLA Assistant" status check to pass.
#   3. Pin the action to the latest release:
#      https://github.com/contributor-assistant/github-action/releases

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run only for comments on pull requests (not plain issues) or PR events.
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        if: >
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: '${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Owners/maintainers are exempt from signing (they set the terms).
          # Keep in sync with .github/CODEOWNERS. Everyone else must still sign.
          allowlist: 'dependabot[bot],github-actions[bot],collabdt,nicoarellano,ken-99,FatemehMashhadi20,gbassali'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            Thank you for your contribution to the CDT platform core repository!

            Before we can merge, **all contributors must sign the [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md)**. You keep the copyright in your work; the CLA lets us distribute it under both the AGPL-3.0 and our commercial terms.

            To sign, please post the following comment on this pull request:
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
