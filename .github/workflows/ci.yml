name: CI

# Runs the same install, build and unit tests as release.yml, but on every pull request, so
# a release PR can never be the first place they run. Linux matters: an import whose casing
# differs from the file on disk resolves on Windows and macOS and fails only here.
#
# ONE-TIME SETUP
#   In branch protection for `dev`, require the "verify" status check to pass.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit
