name: Feature request
description: Suggest an enhancement or new feature for CDT
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/collabdt/core/issues) and this has not already been suggested.
          required: true
        - label: This is useful to most users (narrow use cases are better suited to a [plugin](https://docs.collabdt.org/plugins/overview)).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What is the current behaviour and why is it insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why you discarded them.
    validations:
      required: false
